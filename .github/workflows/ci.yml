name: Run CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DEFAULT_PYTHON_VERSION: 3.11

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
      - run: pip install black
      - run: black --check .

  pytest:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          sudo apt-get install -y docker-compose
          docker-compose up --detach solr

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --no-dev --group test

      - run: uv run pytest

  check_labels:
    name: Check labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker://agilepathway/pull-request-label-checker:latest
        with:
          any_of: major,minor,patch
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  draft-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pytest]
    permissions:
      contents: write # for release-drafter/release-drafter to create a github release
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6.1.0
        with:
          config-name: configs/release-drafter.yml
          latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'}}
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'}}
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
